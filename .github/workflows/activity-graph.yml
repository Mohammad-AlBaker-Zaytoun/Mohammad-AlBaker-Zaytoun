name: Update profile activity graph

on:
  workflow_dispatch:
  schedule:
    - cron: '25 2 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/generate_activity_graph.py'
      - '.github/workflows/activity-graph.yml'

permissions:
  contents: write

concurrency:
  group: profile-activity-graph
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate contribution graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_activity_graph.py
      - name: Commit updated SVG
        run: |
          git add profile/activity-graph.svg
          if git diff --cached --quiet; then
            echo "No changes to activity graph"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(profile): refresh activity graph"
          git push
